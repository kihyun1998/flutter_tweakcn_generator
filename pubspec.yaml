name: flutter_tweakcn_generator
description: >-
  Converts tweakcn CSS themes into Flutter ThemeData with ColorScheme,
  ThemeExtension, Google Fonts, and light/dark mode support.
version: 0.4.0
repository: https://github.com/kihyun1998/flutter_tweakcn_generator
topics:
  - theme
  - code-generation
  - css
  - design-system
  - shadcn

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  build: ">=2.0.0 <5.0.0"
  yaml: ^3.1.0
  path: ^1.9.0
  # Formats the generated output. Deliberately wide, and NOT `^<newest>`: the
  # analyzer that the newest dart_style depends on wants a newer `meta` than
  # the Flutter SDK pins, so raising the floor to it makes this package
  # unresolvable in every Flutter project — which is every project that uses
  # it. A Flutter project resolves the floor; this package resolves the top.
  # The floor is 3.1.1 rather than 3.0.0 because those two format this
  # generator's output differently, and 3.1.1 and the current top do not — so
  # the theme committed under example/ is the same file either way. Check that
  # again before moving either end.
  dart_style: ">=3.1.1 <4.0.0"
  pub_semver: ^2.2.0

dev_dependencies:
  build_runner: ">=2.0.0 <3.0.0"
  build_test: ">=2.0.0 <4.0.0"
  test: ^1.25.0
  lints: ^6.0.0
